name: AMC Copilot CI

# CI for the AMC Copilot plugin at plugins/rtcamp-amc-copilot/. Every job runs
# from that directory, and uses the plugin's own composer/npm scripts and
# phpcs.xml.dist, so CI and local runs (docs/CONTRACTS.md section 16) agree.
#
# A plugin's own .github/ folder never runs on GitHub; this repo-root workflow
# is the entry point and must be updated if the plugin moves.

on:
  pull_request:
    paths:
      - 'plugins/rtcamp-amc-copilot/**'
      - '.github/workflows/amc-copilot-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'plugins/rtcamp-amc-copilot/**'
      - '.github/workflows/amc-copilot-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugins/rtcamp-amc-copilot

jobs:
  # PHPCS with the plugin ruleset (rtCampWP: WPCS + VIP + Slevomat) and PHPStan.
  php-lint:
    name: PHP lint & static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('plugins/rtcamp-amc-copilot/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPCS (plugin ruleset)
        run: composer lint

      - name: PHPStan
        run: composer phpstan -- --no-progress

  # PHPUnit against a downloaded WordPress and a MySQL service container: the
  # same recipe as the no-Docker local setup, without wp-env.
  php-tests:
    name: PHP tests (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
        wp: ['6.9', 'latest']
        mode: ['single-site', 'multisite']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('plugins/rtcamp-amc-copilot/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # rtcamp/wp-primitives declares PHP 8.2 although its code runs on 8.1
      # (see CONTRACTS.md deviations), so the PHP requirement is ignored here.
      - run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php

      - name: Download WordPress ${{ matrix.wp }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.wp }}" = "latest" ]; then archive=latest.tar.gz; else archive="wordpress-${{ matrix.wp }}.tar.gz"; fi
          curl -sSfL "https://wordpress.org/${archive}" | tar -xz -C "${RUNNER_TEMP}"

      - name: Write wp-tests-config.php
        run: |
          cat > "${RUNNER_TEMP}/wp-tests-config.php" <<PHP
          <?php
          define( 'ABSPATH', '${RUNNER_TEMP}/wordpress/' );
          define( 'WP_DEFAULT_THEME', 'default' );
          define( 'WP_DEBUG', true );
          define( 'DB_NAME', 'wordpress_tests' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8mb4' );
          define( 'DB_COLLATE', '' );
          \$table_prefix = 'wptests_';
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test Blog' );
          define( 'WP_PHP_BINARY', 'php' );
          define( 'WPLANG', '' );
          PHP

      - name: PHPUnit
        env:
          WP_PHPUNIT__TESTS_CONFIG: ${{ runner.temp }}/wp-tests-config.php
          WP_MULTISITE: ${{ matrix.mode == 'multisite' && '1' || '0' }}
        run: vendor/bin/phpunit -c phpunit.xml.dist

  # ESLint, Stylelint, package.json lint, Jest and the production build.
  js:
    name: JS lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: plugins/rtcamp-amc-copilot/.nvmrc
          cache: npm
          cache-dependency-path: plugins/rtcamp-amc-copilot/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint (JS, CSS, package.json)
        run: npx npm-run-all --parallel lint:js lint:css lint:package-json

      - name: Jest
        run: npm run test:js

      - name: Production build
        run: npm run build:prod

  # Playwright against wp-env. Skipped until the first e2e spec lands.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Look for e2e specs
        id: specs
        run: |
          if find tests -path '*e2e*' \( -name '*.spec.js' -o -name '*.spec.ts' \) | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Playwright specs yet; e2e skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.specs.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: plugins/rtcamp-amc-copilot/.nvmrc
          cache: npm
          cache-dependency-path: plugins/rtcamp-amc-copilot/package-lock.json

      - if: steps.specs.outputs.found == 'true'
        run: npm ci --no-audit --no-fund

      - if: steps.specs.outputs.found == 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.specs.outputs.found == 'true'
        run: npm run build:prod && npx wp-env start

      - if: steps.specs.outputs.found == 'true'
        env:
          CI: 'true'
          WP_BASE_URL: http://localhost:8888
        run: npx playwright test

      - name: Upload Playwright report
        if: failure() && steps.specs.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            plugins/rtcamp-amc-copilot/playwright-report/
            plugins/rtcamp-amc-copilot/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # VIP code analysis stand-in. automattic/vip-go-ci needs a VIP API token, so
  # until the repo is connected to VIP this runs WordPressVIPMinimum (the rule
  # set vip-go-ci reports from) on production code. Errors fail; warnings are
  # reported only.
  vip-scan:
    name: VIP scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('plugins/rtcamp-amc-copilot/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: WordPressVIPMinimum
        run: >-
          vendor/bin/phpcs -p -s --standard=WordPressVIPMinimum --extensions=php
          --runtime-set ignore_warnings_on_exit 1
          inc rtcamp-amc-copilot.php
